<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f6"><title>Обновление приложения</title><style>body{margin:0;background:#f6f6f6;color:#181818;font:16px/1.5 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:420px;margin:auto;padding:calc(40px + env(safe-area-inset-top)) 24px}h1{font-size:28px;line-height:1.2}button{font:inherit;background:#ffdf00;border:0;border-radius:20px;padding:18px;width:100%;cursor:pointer}p{color:#777}#status{font-size:14px}</style></head><body><main><h1>Обновим приложение</h1><p>Эта кнопка удалит старую офлайн-копию «Ворот ЖК Песчаный» на этом устройстве и откроет новую версию. Номера и фотографии останутся на сайте.</p><button id="repair">Обновить и открыть</button><p id="status" role="status"></p></main><script>
const button=document.getElementById('repair'),status=document.getElementById('status');
button.onclick=async()=>{button.disabled=true;status.textContent='Проверяем доступность новой версии…';try{
 const base=new URL('./',location.href);
 const response=await fetch(new URL('index.html?verify='+Date.now(),base),{cache:'no-store'});
 if(!response.ok)throw new Error('Сайт пока недоступен.');const html=await response.text();if(!html.includes('app-v14.js'))throw new Error('Новая версия ещё не опубликована. Подождите завершения публикации GitHub.');
 for(const file of ['styles-v14.css','app-v14.js','gates-v14.js','assets/masterplan-perspective.jpg',...[1,2,3,4,5,6].map(n=>`assets/gate-${n}.webp`)]){const r=await fetch(new URL(file+'?verify='+Date.now(),base),{cache:'no-store'});if(!r.ok)throw new Error('Не все файлы загружены. Загрузите весь архив и повторите.');}
 status.textContent='Удаляем старую копию…';
 if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===base.href).map(r=>r.unregister()));}
 if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('anapa-gates-')).map(k=>caches.delete(k)));}
 location.replace(new URL('?updated='+Date.now(),base).href);
 }catch(e){status.textContent=e.message||'Не удалось обновить. Проверьте интернет и повторите.';button.disabled=false;}};
</script></body></html>
